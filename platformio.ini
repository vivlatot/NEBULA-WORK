; =====================================================================
;  Tamagotchi del Osito  -  ESP32 + pantalla TFT
; ---------------------------------------------------------------------
;  Elige el entorno que corresponde a tu placa:
;
;    pio run -e cyd       -t upload   -> ESP32-2432S028R "Cheap Yellow Display"
;                                        (2.8" ILI9341 320x240 + tactil XPT2046)
;    pio run -e tdisplay  -t upload   -> LilyGO TTGO T-Display
;                                        (1.14" ST7789 240x135 + 2 botones)
;    pio run -e generic   -t upload   -> ESP32 DevKit + modulo ILI9341 SPI
;                                        cableado a mano + 2 pulsadores
;
;  La configuracion de TFT_eSPI va entera en build_flags, asi que NO hace
;  falta tocar User_Setup.h de la libreria.
; =====================================================================

[platformio]
default_envs = cyd

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------
;  Cheap Yellow Display (ESP32-2432S028R)
;  Si los colores salen invertidos prueba a quitar/poner TFT_INVERSION_ON.
;  Si tu CYD es la version "2 USB" y se ve mal, cambia ILI9341_2_DRIVER
;  por ST7789_DRIVER.
; ---------------------------------------------------------------------
[env:cyd]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    paulstoffregen/XPT2046_Touchscreen
build_flags =
    ${env.build_flags}
    -DBOARD_CYD=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; ---------------------------------------------------------------------
;  LilyGO TTGO T-Display (ESP32 + ST7789 135x240)
; ---------------------------------------------------------------------
[env:tdisplay]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_TDISPLAY=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000

; ---------------------------------------------------------------------
;  ESP32 DevKit + modulo ILI9341 2.4"/2.8" SPI (cableado propio)
;  Ajusta los pines a como lo tengas conectado.
; ---------------------------------------------------------------------
[env:generic]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_GENERIC=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DPIN_BTN_A=27
    -DPIN_BTN_B=26
